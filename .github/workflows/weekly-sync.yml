name: Weekly Corpus Sync

# Picks up new RetroMacCast episodes, transcribes/classifies/synthesizes just the new stuff
# (never re-touches the existing archive), and publishes the updated corpus as a GitHub
# Release asset for the app to download. Runs on macos-latest since transcription needs a
# real whisper.cpp binary (via Homebrew), not something available on Linux runners here.

on:
  schedule:
    - cron: "0 8 * * 1" # Every Monday at 08:00 UTC
  workflow_dispatch: {} # "Run workflow" button in the Actions tab, for manual/on-demand runs

permissions:
  contents: write # needed to create a Release and upload assets

jobs:
  sync:
    runs-on: macos-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4

      - name: Install whisper-cpp + ffmpeg
        run: brew install whisper-cpp ffmpeg

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: pipeline/models
          key: whisper-model-ggml-small-en-v1

      - name: Download Whisper model (if not cached)
        run: |
          mkdir -p models
          if [ ! -f models/ggml-small.en.bin ]; then
            curl -L --fail -o models/ggml-small.en.bin \
              https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small.en.bin
          fi

      - name: Build pipeline
        run: swift build -c release

      - name: Download latest published corpus, if one exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p corpus
          # Distinguish "no release has ever been published" (the only case that should
          # legitimately fall through to starting from an empty corpus) from a real download
          # failure -- auth hiccup, rate limit, transient network error. The old
          # `gh release download ... || echo ...` swallowed BOTH identically: if this ever
          # failed on a week where a real corpus already existed, the run silently started
          # from empty, crawled/transcribed only up to --limit 10 new episodes, and the
          # "publish a release if the episode/video count changed" step at the end of this
          # job would then happily publish that near-empty corpus AS the new release --
          # effectively rolling back the whole archive the app downloads. Checking
          # `gh release list` first makes "nothing published yet" an explicit, separately
          # verified case instead of inferring it from why the download call happened to
          # fail -- so a genuine download failure now fails this step outright (visible,
          # investigable) rather than silently proceeding on an empty corpus.
          if [ -z "$(gh release list --limit 1 2>/dev/null)" ]; then
            echo "No releases published yet -- starting from an empty corpus."
          else
            gh release download --pattern 'rmc.sqlite' --dir corpus --clobber
          fi

      - name: Record starting episode count
        run: |
          if [ -f corpus/rmc.sqlite ]; then
            .build/release/rmc-pipeline export-manifest --output corpus/before-manifest.json
          else
            echo '{"episodeCount": 0, "videoCount": 0}' > corpus/before-manifest.json
          fi

      - name: Crawl index (pick up newly published episodes)
        run: .build/release/rmc-pipeline crawl-index

      - name: Resolve audio URLs
        run: .build/release/rmc-pipeline resolve-audio

      - name: Transcribe new episodes
        # --limit 10 is a safety bound, not the expected case -- a normal week has ~1 new
        # episode. It exists so that if a large backlog ever piles up again for any reason,
        # one run makes bounded, real progress (and still publishes a release) instead of
        # risking another multi-hour run that the job timeout kills with nothing saved.
        # Whatever's left over just gets picked up by the following week's run.
        run: .build/release/rmc-pipeline transcribe-batch --model models/ggml-small.en.bin --limit 10

      - name: Record classify start time
        id: since
        run: echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Classify new episodes into collections
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: .build/release/rmc-pipeline classify

      - name: Reset synthesis for collections touched by new episodes
        run: .build/release/rmc-pipeline reset-stale-synthesis --since "${{ steps.since.outputs.timestamp }}"

      - name: Re-synthesize touched collections
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: .build/release/rmc-pipeline synthesize

      - name: Sync videos from YouTube
        # continue-on-error -- this step (and YouTubeClient's own network calls) now retry
        # transient failures internally, but if the YouTube API is having a genuinely bad day
        # and every retry is exhausted, a failure here shouldn't cost the whole week's episode
        # sync: crawl-index/transcribe/classify/synthesize have already succeeded by this
        # point, and export-manifest + the release step below still need to run regardless.
        # A failed step here still shows red in the Actions history (so it's visible), it just
        # doesn't fail the overall job -- video data simply doesn't advance that week and gets
        # picked up on the next run, same self-healing story as a skipped crawl-index month.
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: .build/release/rmc-pipeline sync-videos

      - name: Export manifest
        run: .build/release/rmc-pipeline export-manifest

      - name: Publish a release if the episode or video count changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EP_BEFORE=$(jq '.episodeCount' corpus/before-manifest.json)
          EP_AFTER=$(jq '.episodeCount' corpus/manifest.json)
          VID_BEFORE=$(jq '.videoCount // 0' corpus/before-manifest.json)
          VID_AFTER=$(jq '.videoCount // 0' corpus/manifest.json)
          echo "Episodes before: $EP_BEFORE, after: $EP_AFTER"
          echo "Videos before: $VID_BEFORE, after: $VID_AFTER"
          if [ "$EP_BEFORE" = "$EP_AFTER" ] && [ "$VID_BEFORE" = "$VID_AFTER" ]; then
            echo "No new episodes or videos -- skipping release."
            exit 0
          fi
          # Time suffix, not just the date -- a same-day manual workflow_dispatch retry
          # (e.g. after a transient failure) would otherwise collide with this same tag and
          # fail at release-create, same class of bug fixed in fix-content-quality.yml.
          TAG="corpus-$(date -u +%Y-%m-%d)-$(date -u +%H%M%S)"
          gh release create "$TAG" corpus/rmc.sqlite corpus/manifest.json \
            --title "Corpus sync $(date -u +%Y-%m-%d)" \
            --notes "Automated weekly sync -- $EP_AFTER episodes (was $EP_BEFORE), $VID_AFTER videos (was $VID_BEFORE)."
