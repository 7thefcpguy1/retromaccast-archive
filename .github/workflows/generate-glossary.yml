name: Generate Glossary Terms

# Mines each episode's transcript for vintage Mac/Apple terminology the hosts actually explain
# (`generate-glossary`), for the Glossary tab prototype. Manual-only (no schedule) -- `limit`
# defaults to a small test batch so a first run's content/cost can be sanity-checked before
# re-dispatching with limit=0 for the full corpus.
#
# Routine, week-to-week mining of newly-published episodes is now handled automatically by
# weekly-sync.yml's own "Mine glossary terms from new episodes" step (same underlying command,
# no --reset) -- that's naturally incremental, since `generate-glossary` only ever picks up
# episodes it hasn't mined before. What's left for THIS workflow to do by hand: the very first
# full-corpus backfill, and a `--reset` re-run whenever a prompt change invalidates everything
# mined so far (weekly-sync deliberately never passes --reset itself, so a bad prompt can't
# silently wipe the whole glossary on its own).

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max episodes to mine (0 = no limit, i.e. the full corpus)"
        required: true
        default: "20"
      reset:
        description: "Wipe all existing glossary_terms first (only after a prompt change invalidates prior results)"
        type: boolean
        required: true
        default: false

permissions:
  contents: write # needed to create a Release and upload the updated corpus

jobs:
  generate:
    runs-on: macos-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4

      - name: Build pipeline
        run: swift build -c release

      - name: Download latest published corpus
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p corpus
          gh release download --pattern 'rmc.sqlite' --dir corpus --clobber

      - name: Mine glossary terms
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Passed through env, not interpolated directly into the script below via `${{ }}`
          # templating -- these are free-text workflow_dispatch inputs, and direct
          # interpolation into a `run:` block is a known GitHub Actions script-injection
          # vector (a value containing shell metacharacters would execute as this runner's own
          # shell code, in an environment holding ANTHROPIC_API_KEY and a contents:write
          # token). Reading them back as ordinary shell variables sidesteps that entirely.
          LIMIT: ${{ github.event.inputs.limit }}
          RESET: ${{ github.event.inputs.reset }}
        run: |
          RESET_FLAG=""
          if [ "$RESET" = "true" ]; then
            RESET_FLAG="--reset"
          fi
          .build/release/rmc-pipeline generate-glossary --limit "$LIMIT" $RESET_FLAG

      - name: Export manifest
        run: .build/release/rmc-pipeline export-manifest

      - name: Publish updated corpus as a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Same reasoning as the "Mine glossary terms" step -- read back via env, not
          # interpolated directly into this run: block.
          LIMIT: ${{ github.event.inputs.limit }}
        run: |
          TAG="corpus-$(date -u +%Y-%m-%d)-glossary-$(date -u +%H%M%S)"
          EP_COUNT=$(jq '.episodeCount' corpus/manifest.json)
          gh release create "$TAG" corpus/rmc.sqlite corpus/manifest.json \
            --title "Glossary terms $(date -u +%Y-%m-%d)" \
            --notes "generate-glossary run (limit=$LIMIT). $EP_COUNT episodes total."
