name: RetroMacCast
options:
  bundleIdPrefix: com.retromaccast
  createIntermediateGroups: true

packages:
  RMCCore:
    path: ../pipeline

targets:
  RetroMacCast-iOS:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: RetroMacCast/Sources
      - path: RetroMacCast/Resources
        buildPhase: resources
    dependencies:
      - package: RMCCore
    info:
      path: Generated/Info-iOS.plist
      properties:
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_NAME: RetroMacCast
        INFOPLIST_KEY_CFBundleDisplayName: RetroMacCast
        PRODUCT_BUNDLE_IDENTIFIER: com.retromaccast.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.10"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  RetroMacCast-macOS:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: RetroMacCast/Sources
      - path: RetroMacCast/Resources
        buildPhase: resources
    dependencies:
      - package: RMCCore
    info:
      path: Generated/Info-macOS.plist
      properties: {}
    settings:
      base:
        PRODUCT_NAME: RetroMacCast
        INFOPLIST_KEY_CFBundleDisplayName: RetroMacCast
        PRODUCT_BUNDLE_IDENTIFIER: com.retromaccast.mac
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.10"
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
